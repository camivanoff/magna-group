<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viaje – MAGNA GROUP</title>

  <!-- Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="topbar">
    <nav class="navbar" aria-label="Navegación principal">
      <a href="index.html" class="logo" aria-label="Ir al inicio">
        <span class="logo__box">
          <img src="img/logo-blanco.png" alt="MAGNA GROUP" class="logo__img">
        </span>
      </a>

      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="grupales.html">Grupales</a></li>
        <li><a href="tienda.html">Tienda</a></li>
        <li><a href="experiencias.html">Experiencias</a></li>
        <li><a href="cotizacion.html">Cotizá tu viaje</a></li>
      </ul>
    </nav>
  </header>

  <!-- ================= HERO GALLERY ================= -->
  <section class="viaje-hero">
    <div class="viaje-gallery" data-viaje-gallery></div>
  </section>

  <!-- ================= CONTENIDO ================= -->
  <main class="page viaje-layout">

    <!-- Encabezado izquierda -->
    <header class="viaje-header">
      <h1 class="page__title" data-viaje-titulo></h1>
      <p class="page__subtitle" data-viaje-subtitulo></p>
    </header>

    <!-- Columna izquierda -->
    <section class="viaje-layout__main">

      <section class="viaje-text">

        <!-- Descripción -->
        <p class="viaje-desc" data-viaje-descripcion></p>

        <!-- Incluye -->
        <h2 class="viaje-h2">¿Qué incluye?</h2>
        <ul class="viaje-list" data-viaje-incluye></ul>

      </section>

      <!-- Botones -->
      <section class="viaje-actions" aria-label="Acciones del viaje">

        <a class="card__btn" data-viaje-pdf download>
          Descargar itinerario
        </a>

        <a class="card__btn viaje__btn-wpp"
           data-viaje-wpp
           target="_blank"
           rel="noopener noreferrer">
          Consultar por WhatsApp
        </a>

      </section>

    </section>

    <!-- Columna derecha -->
    <aside class="viaje-layout__sidebar">
      <div class="viaje-box">
        <h3 class="viaje-box__title">Detalles del viaje</h3>

        <p class="viaje-box__meta" data-viaje-subtitulo-box></p>

        <div class="viaje-box__price" data-viaje-precio></div>
      </div>
    </aside>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    <div class="footer__content">
      <p class="footer__text">Seguinos en nuestras redes</p>

      <div class="footer__socials">
        <a href="https://www.instagram.com/travelvip.uy" target="_blank" rel="noopener noreferrer">
          <img src="img/instagram.svg" alt="Instagram" />
        </a>
        <a href="https://www.tiktok.com/@travelvip.uy" target="_blank" rel="noopener noreferrer">
          <img src="img/tiktok.svg" alt="TikTok" />
        </a>
        <a href="https://www.facebook.com/travelviptellevaadondequieras" target="_blank" rel="noopener noreferrer">
          <img src="img/facebook.svg" alt="Facebook" />
        </a>
      </div>

      <p class="footer__copy">© 2026 MAGNA GROUP</p>
    </div>
  </footer>

  <!-- JS -->
  <script src="./js/viajes.js"></script>

</body>
</html>
