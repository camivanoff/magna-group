<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotizá tu viaje – MAGNA GROUP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="topbar">
  <nav class="navbar" aria-label="Navegación principal">
    <a href="index.html" class="logo">
      <img src="img/logo-blanco.png" alt="MAGNA GROUP">
    </a>

    <ul class="menu">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="grupales.html">Grupales</a></li>
      <li><a href="tienda.html">Tienda</a></li>
      <li><a href="experiencias.html">Experiencias</a></li>
      <li><a href="cotizacion.html" aria-current="page">Cotizá tu viaje</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="form-section" aria-label="Formulario de cotización">
    <h1>Cotizá tu viaje</h1>
    <p class="form-subtitle">
      Contanos qué tipo de viaje estás buscando y te respondemos a la brevedad.
    </p>

    <form class="travel-form" action="https://formspree.io/f/mzdalege" method="POST">

      <div class="form-group">
        <label for="nombre">Nombre y apellido</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Ana Pérez" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@mail.com" required />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono / WhatsApp</label>
        <input type="tel" id="telefono" name="telefono" placeholder="+598 9xxxxxxx" required />
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de viaje</label>
        <select id="tipo" name="tipo" required>
          <option value="">Seleccioná una opción</option>
          <option value="grupal">Viaje grupal</option>
          <option value="terrestre">Viaje terrestre</option>
          <option value="medida">Viaje a medida</option>
        </select>
      </div>

      <div class="form-group">
        <label for="destino">Destino de interés</label>
        <input type="text" id="destino" name="destino" placeholder="Japón, Caribe, Europa…" />
      </div>

      <div class="form-group">
        <label for="mensaje">Contanos un poco más</label>
        <textarea id="mensaje" name="mensaje" rows="5"
          placeholder="Fechas estimadas, cantidad de personas, presupuesto, preferencias, etc."></textarea>
      </div>

      <button type="submit" class="form-btn">Enviar consulta</button>

      <!-- Mensaje de estado -->
      <p id="form-status" style="margin-top:15px; font-weight:500;"></p>

    </form>
  </section>
</main>

<footer class="footer">
  <div class="footer__content">
    <p class="footer__text">Seguinos en nuestras redes</p>

    <div class="footer__socials">
      <a href="https://www.instagram.com/travelvip.uy" target="_blank">
        <img src="img/instagram.svg" alt="Instagram" />
      </a>
      <a href="https://www.tiktok.com/@travelvip.uy" target="_blank">
        <img src="img/tiktok.svg" alt="TikTok" />
      </a>
      <a href="https://www.facebook.com/travelviptellevaadondequieras" target="_blank">
        <img src="img/facebook.svg" alt="Facebook" />
      </a>
    </div>

    <p class="footer__copy">© 2026 MAGNA GROUP</p>
  </div>
</footer>

<script>
  const form = document.querySelector(".travel-form");
  const statusEl = document.getElementById("form-status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusEl.textContent = "Enviando consulta...";

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        statusEl.textContent = "✅ Gracias, enseguida te responderemos.";
        form.reset();
      } else {
        statusEl.textContent = "❌ Ocurrió un error. Intentá nuevamente.";
      }
    } catch (error) {
      statusEl.textContent = "❌ Error de conexión. Intentá nuevamente.";
    }
  });
</script>

<script defer src="/js/nav.js"></script>

</body>
</html>
